<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>다시보기 찾는 중</title>
        <!-- Shared extension page tokens and bundled Pretendard; the theme follows the system setting. -->
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="options-brand.css" />
        <style>
            body {
                display: grid;
                min-height: 100vh;
                margin: 0;
                padding: 16px;
                place-items: center;
                background: var(--bg);
                color: var(--text);
                font-family:
                    "Pretendard Variable",
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    "Malgun Gothic",
                    sans-serif;
                font-size: 14px;
                line-height: 1.55;
            }

            main {
                display: grid;
                gap: 8px;
                max-width: 28rem;
                padding: 28px 24px;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: var(--surface);
                text-align: center;
                word-break: keep-all;
                overflow-wrap: anywhere;
            }

            h1 {
                margin: 0 0 4px;
                color: var(--text);
                font-family: inherit;
                font-size: 18px;
                font-weight: 700;
                line-height: 1.4;
                letter-spacing: 0;
            }

            p {
                margin: 0;
                color: var(--text-muted);
            }
        </style>
    </head>
    <body>
        <main>
            <h1>다시보기를 찾고 있어요</h1>
            <p>시청 기록에 저장된 방송 정보로 다시보기 번호를 조회하고 있어요.</p>
            <p>
                다시보기를 찾으면 이 탭에서 바로 이동해요. 잠시 후에도 이동하지 않으면 기록 목록에서 다시 시도해 주세요.
            </p>
        </main>
    </body>
</html>
